name: AX Job Agent

# 수동 실행 + 주 1회 자동 실행
# cron은 UTC 기준: "0 0 * * 1" = 매주 월요일 00:00 UTC = 매주 월요일 09:00 KST
# (GitHub Actions schedule은 정확한 시각을 보장하지 않으므로 "월요일 오전 9시 전후"로 이해한다)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

# history CSV를 repository에 commit/push하기 위해 쓰기 권한만 추가
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chapter11/ax-job-agent

    # 인증정보는 GitHub Repository Secrets에서 주입한다 (.env는 사용하지 않음)
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AX Job Agent
        run: python main.py

      # main.py가 성공한 경우에만 실행된다 (앞 step이 실패하면 이 step은 건너뛴다)
      # 다음 실행에서도 신규 공고를 판별할 수 있도록 history CSV 하나만 commit/push한다 (보고서는 commit하지 않음)
      - name: Persist updated history
        working-directory: .
        run: |
          HISTORY_FILE="chapter11/ax-job-agent/data/processed/jobs_history.csv"
          if git diff --quiet -- "$HISTORY_FILE"; then
            echo "history 변경 없음 — commit 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$HISTORY_FILE"
            git commit -m "chore: update AX job history"
            git push
          fi
